[project]
name = "ableton-ctrl"
version = "0.1.0"
description = "Desktop GUI for controlling Ableton Live device parameters over OSC"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "python-osc>=1.8",
    "python-rtmidi>=1.5.8",
    "websockets>=16.1.1",
]

[tool.uv]
# scripts/ is a plain script directory, not an installable package.
package = false
